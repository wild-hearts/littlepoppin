<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You. Little Poppin</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="nav nav--scrolled">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo"><img src="images/logo.jpg" alt="Little Poppin" /></a>
    </div>
  </nav>

  <section class="status-page">
    <div class="container">
      <div class="status-card">
        <div class="status-card__icon status-card__icon--success">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h1>Thank you for your order!</h1>
        <p class="status-card__lead" id="orderLead">Your payment was successful and your order is confirmed. We’ll email you if we need anything.</p>
        <p class="status-card__meta" id="orderMeta"></p>
        <div class="status-card__download" id="downloadArea"></div>
        <a href="index.html" class="btn btn--primary">Back to Little Poppin</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <nav class="footer__legal" aria-label="Legal">
          <a href="shipping.html">Shipping</a>
          <a href="refunds.html">Refunds &amp; Returns</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </nav>
        <p>&copy; 2025 Little Poppin. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('session_id');
      var meta = document.getElementById('orderMeta');
      if (!id || !meta) return;
      fetch('/api/order?session_id=' + encodeURIComponent(id))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (o) {
          if (o && o.paid && o.amount_total != null) {
            var amount = '$' + (o.amount_total / 100).toFixed(2) + ' ' + (o.currency || 'aud').toUpperCase();
            meta.textContent = 'Order confirmed, ' + amount + (o.email ? ' · receipt sent to ' + o.email : '');
          }
          // GA4 purchase event. No-ops when analytics is not configured. Fired here rather
          // than in the webhook because GA4 needs the buyer's browser, not the server.
          try {
            if (typeof window.gtag === 'function' && o && o.paid && !window.__lpPurchaseSent) {
              window.__lpPurchaseSent = true;
              window.gtag('event', 'purchase', {
                transaction_id: id,
                value: (o.amount_total || 0) / 100,
                currency: (o.currency || 'aud').toUpperCase(),
                items: o.sku ? [{ item_id: o.sku, item_category: o.type || 'unknown' }] : [],
              });
            }
          } catch (e) {}
          var lead = document.getElementById('orderLead');
          if (lead && o && o.paid) {
            if (o.type === 'print') lead.textContent = 'Your payment was successful. Your print is being made now at the production partner closest to you, and we\u2019ll email tracking once it ships.';
            else if (o.type === 'physical') lead.textContent = 'Your payment was successful and your order is confirmed. We\u2019ll get your swaddle on its way and email you if we need anything.';
          }
          if (o && o.paid && (o.type === 'digital' || o.type === 'personalised') && o.sku) {
            var dl = document.getElementById('downloadArea');
            if (dl) {
              var a = document.createElement('a');
              a.href = '/api/download?session_id=' + encodeURIComponent(id) + '&sku=' + encodeURIComponent(o.sku);
              a.className = 'btn btn--primary';
              a.textContent = o.type === 'personalised'
                ? '⬇  Download your personalised print'
                : '⬇  Download your print';
              dl.appendChild(a);
              if (o.type === 'personalised') {
                var note = document.createElement('p');
                note.className = 'status-card__note';
                note.textContent = 'Your PDF has the same design at three print-ready sizes. 8×10 inch, A4 and 16×20 inch. '
                  + 'It takes a moment to prepare, so the download may pause briefly before it starts.';
                dl.appendChild(note);
              }
            }
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
